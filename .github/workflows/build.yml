name: Build Sgushenka Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "sgushenka-forge-1.21.1-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract mod project
        run: |
          mkdir project
          unzip sgushenka-forge-1.21.1-source.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build mod
        working-directory: project
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sgushenka-mod-jar
          path: project/build/libs/*.jar
