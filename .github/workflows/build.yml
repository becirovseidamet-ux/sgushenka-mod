name: Build Sgushenka Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "sgushenka-forge-1.21.1-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract mod project
        shell: bash
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found"
            ls -la
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          unzip "$ZIP_FILE" -d project
          find project -maxdepth 3 -name build.gradle -print
          mkdir project
          unzip sgushenka-forge-1.21.1-source.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build mod
        working-directory: project
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sgushenka-mod-jar
          path: project/build/libs/*.jar
